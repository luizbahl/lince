name: lince

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["54320:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Pinned to 24.8 LTS: newer images require AVX/AVX2, which the dev machine lacks.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: lince
      CLICKHOUSE_PASSWORD: lince
      CLICKHOUSE_DB: lince
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: [ch_data:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 120s

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  tests:
    profiles: ["test"]
    hostname: tests
    build:
      context: ./infra/elixir
    working_dir: /app/services/ingestor
    environment:
      MIX_ENV: test
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_HOST: postgres
    volumes:
      - .:/app
      - ingestor_deps:/app/services/ingestor/deps
      - ingestor_build:/app/services/ingestor/_build
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }

volumes:
  pg_data:
  ch_data:
  grafana_data:
  ingestor_deps:
  ingestor_build:
